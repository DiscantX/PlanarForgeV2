name: Documentation
description: Write, fix, or reorganise documentation
labels: ["type: docs"]
body:
  - type: markdown
    attributes:
      value: |
        Every issue needs at least two labels. This template sets `type: docs`; please also add one `area:` label (core, schema, driver-ie, viewer, tests, wiki).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [core, schema, driver-ie, viewer, tests, wiki, other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Which pages, and what needs to change
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: IESDP or Near Infinity pages, or other references the change relies on.
  - type: checkboxes
    id: assets
    attributes:
      label: Game files
      options:
        - label: I have not attached or pasted game files or extracts (see the Game Asset Policy).
          required: true
